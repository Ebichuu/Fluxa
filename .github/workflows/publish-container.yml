name: Publish container

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Type-check and build web app
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/nasemby-core/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r services/nasemby-core/requirements.txt

      - name: Run backend and API contract tests
        working-directory: services/nasemby-core
        run: python -m unittest discover -s tests -t . -v

  publish:
    name: Build immutable image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.resolved.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse existing immutable image
        id: existing
        env:
          IMAGE_TAG: ghcr.io/ebichuu/fluxa:sha-${{ github.sha }}
        run: |
          set +e
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "${IMAGE_TAG}" 2>&1)"
          INSPECT_STATUS=$?
          set -e
          if [ "${INSPECT_STATUS}" -eq 0 ]; then
            DIGEST="$(printf '%s\n' "${INSPECT_OUTPUT}" | awk '$1 == "Digest:" { print $2; exit }')"
            if [ -z "${DIGEST}" ]; then
              printf '%s\n' "${INSPECT_OUTPUT}" >&2
              echo "Existing image inspection succeeded without a digest." >&2
              exit 1
            fi
            echo "Reusing ${IMAGE_TAG}@${DIGEST}"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          elif printf '%s\n' "${INSPECT_OUTPUT}" | grep --extended-regexp --ignore-case --quiet \
            'manifest unknown|name unknown' \
            || printf '%s\n' "${INSPECT_OUTPUT}" | grep --fixed-strings --ignore-case --quiet \
              "${IMAGE_TAG}: not found"; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${INSPECT_OUTPUT}" >&2
            exit "${INSPECT_STATUS}"
          fi

      - name: Generate image metadata
        id: meta
        if: steps.existing.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ebichuu/fluxa
          tags: |
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=Fluxa
            org.opencontainers.image.description=Personal media automation control center

      - name: Build and push image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLUXA_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resolve published digest
        id: resolved
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          DIGEST="${EXISTING_DIGEST:-${BUILT_DIGEST}}"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  smoke:
    name: Smoke test published image (${{ matrix.platform }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start image and verify HTTP health
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker run --detach --name fluxa-smoke --platform "${PLATFORM}" --publish 127.0.0.1:8987:8987 \
            --env MCC_ENV=production --env APP_PORT=8987 \
            ghcr.io/ebichuu/fluxa@${IMAGE_DIGEST}
          for attempt in $(seq 1 45); do
            HEALTH_PAYLOAD="$(curl --fail --silent --show-error http://127.0.0.1:8987/healthz || true)"
            HEALTH_REVISION="$(printf '%s' "${HEALTH_PAYLOAD}" | jq -r '.revision // empty' 2>/dev/null || true)"
            if [ "${HEALTH_REVISION}" = "${EXPECTED_REVISION}" ]; then
              curl --fail --silent --show-error http://127.0.0.1:8987/auth/setup >/dev/null
              ASSET_FILE="$(docker exec fluxa-smoke sh -c 'find /app/dist/assets -maxdepth 1 -type f | head -n 1')"
              ASSET_PATH="${ASSET_FILE#/app/dist}"
              test -n "${ASSET_PATH}"
              curl --fail --silent --show-error "http://127.0.0.1:8987${ASSET_PATH}" >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs fluxa-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs fluxa-smoke || true

  promote-latest:
    name: Promote verified image to latest
    needs:
      - publish
      - smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm this commit is still the main branch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -er '.object.sha')"
          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Refusing to move latest: main is ${CURRENT_SHA}, this run is ${EXPECTED_SHA}."
            exit 1
          fi

      - name: Point latest to verified digest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag ghcr.io/ebichuu/fluxa:latest ghcr.io/ebichuu/fluxa@${IMAGE_DIGEST}

      - name: Verify latest manifest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          LATEST_DIGEST="$(docker buildx imagetools inspect ghcr.io/ebichuu/fluxa:latest | awk '$1 == "Digest:" { print $2; exit }')"
          test "${LATEST_DIGEST}" = "${IMAGE_DIGEST}"
